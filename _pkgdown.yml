url: https://shilab-ecnu.github.io/MERLIN/
template:
  bootstrap: 5
  mathjax: true
  bslib:
    bootswatch: united
    bg: "#FFFFFF"
    fg: "#1A1A2E" 
    primary: "#154360"   
    link-color: '#1171C0'
    input-bg: "#FFFFFF"
    dropdown-bg: "#FFFFFF"
    dropdown-link-color: "#1A1A2E" 
    dropdown-link-hover-bg: "#B3B6B7"
    dropdown-border-color: '#dfdcd9'

navbar:
  structure:
    left:
      - home
      - articles
      - functions
      - changelog
      
    right:
      - search
      - github

  components:
    articles:
      text: "Guide"
      menu:
        - text: "List of articles"
          href: articles/index.html
        - text: "Part 1: Introduction and Data Requirements"
          href: articles/MERLIN.intro.html
        - text: "Part 2: Data Preprocessing and Instrumental Variable Selection"
          href: articles/MERLIN.preprocess.html
        - text: "Part 3: Model Fitting Using Simulated Data"
          href: articles/MERLIN.sim.html
        - text: "Part 4: Model Fitting with a Single Available GWIS (MERLIN-MO and MERLIN-ME)"
          href: articles/MERLIN.single-GWIS.sim.html
        - text: "Part 5: Real Data Analysis and Convergence Diagnostics"
          href: articles/MERLIN.realdata.html
    changelog:
      text: "Changelog"
      href: news/index.html
    functions:
      text: "Functions"
      href: articles/MERLIN.functions.html
    github:
      icon: fa-github
      href: https://github.com/shilab-ecnu/MERLIN
      aria-label: View source code on GitHub

articles:
  - title: "Getting started"
    contents:
      - MERLIN.intro

  - title: "Data preparation"
    contents:
      - MERLIN.preprocess

  - title: "Analysis and simulation"
    contents:
      - MERLIN.sim
      - MERLIN.single-GWIS.sim
      - MERLIN.realdata
  - title: internal
    contents:
      - MERLIN.functions

